<div class="card-body">
  <form>

    <div class="row">

      <!-- ID Produit -->
      <div class="col-md-2 mb-3">
        <label for="idProduit" class="form-label">ID Produit</label>
        <input
          type="text"
          id="idProduit"
          [(ngModel)]="newProduit.idProduit"
          name="idProduit"
          class="form-control">
      </div>

      <!-- Nom Produit -->
      <div class="col-md-4 mb-3">
        <label for="nomProduit" class="form-label">Nom Produit</label>
        <input
          type="text"
          id="nomProduit"
          [(ngModel)]="newProduit.nomProduit"
          name="nomProduit"
          class="form-control">
      </div>

      <!-- Prix Produit -->
      <div class="col-md-2 mb-3">
        <label for="prixProduit" class="form-label">Prix Produit</label>
        <input
          type="number"
          id="prixProduit"
          [(ngModel)]="newProduit.prixProduit"
          name="prixProduit"
          class="form-control">
      </div>

      <!-- Date création -->
      <div class="col-md-4 mb-3">
        <label for="dateCreation" class="form-label">Date création</label>
        <input
          type="date"
          id="dateCreation"
          [(ngModel)]="newProduit.dateCreation"
          name="dateCreation"
          class="form-control">
      </div>

    </div>

    <!-- Bouton -->
    <div class="mt-3">
      <button
        type="submit"
        (click)="addProduit()"
        class="btn btn-success">
        Ajouter
      </button>
    </div>

  </form>
</div>
